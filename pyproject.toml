[project]
name = "bitmap-face"
version = "0.1.0"
description = "Can a language model draw and encode 1-bit bitmap faces?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.122",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
bitface = "bitmap_face.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]
