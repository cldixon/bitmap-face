<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bitface</title>
<link rel="stylesheet" href="/panel.css">
</head>
<body>
  <nav id="nav" class="nav" role="tablist" aria-label="View">
    <span class="mark">bitface</span>
    <button role="tab" data-view="overview">overview</button>
    <button role="tab" data-view="sheet">form comparison</button>
    <button role="tab" data-view="compare">model comparison</button>
    <button role="tab" data-view="inspect">inspect</button>
    <button role="tab" data-view="plate">plate</button>
    <button role="tab" data-view="method">method</button>
  </nav>
  <main>
    <header class="page">
      <h1 id="title"></h1>
      <p id="intro"></p>
    </header>
    <div id="bar" class="bar">
      <div class="subject">
        <label class="field" data-for="suites">model<select id="suites"></select></label>
        <label class="field" data-for="expression">expression<select id="expression"></select></label>
        <label class="field" data-for="targets">form<select id="targets"></select></label>
      </div>
      <div class="controls">
        <label class="field" data-for="repeat">try<select id="repeat"></select></label>
        <button id="chassis" type="button" class="ghost"></button>
      </div>
    </div>
    <dl id="details" class="details"></dl>
    <div id="stage" class="stage"></div>
    <div id="export" class="export">
      <select id="format" aria-label="Format"></select>
      <button id="save" type="button">export</button>
    </div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
