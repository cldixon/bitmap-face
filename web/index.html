<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bitface</title>
<link rel="stylesheet" href="/panel.css">
</head>
<body>
  <nav id="nav" class="nav" role="tablist" aria-label="View">
    <span class="mark">bitface</span>
    <button role="tab" data-view="overview">overview</button>
    <button role="tab" data-view="matrix">matrix</button>
    <button role="tab" data-view="index">index</button>
    <button role="tab" data-view="plate">plate</button>
    <button role="tab" data-view="method">method</button>
  </nav>
  <main>
    <header class="page">
      <h1 id="title"></h1>
      <p id="intro"></p>
    </header>
    <div id="bar" class="bar">
      <div class="subject">
        <label class="field" data-for="suites">model<select id="suites"></select></label>
        <label class="field" data-for="expression">expression<select id="expression"></select></label>
        <label class="field" data-for="targets">form<select id="targets"></select></label>
        <label class="field" data-for="replicate">replicate<select id="replicate"></select></label>
      </div>
    </div>
    <dl id="details" class="details"></dl>
    <div id="display" class="display">
      <label class="check"><input type="checkbox" id="chassis"> desktop chassis</label>
    </div>
    <div id="stage" class="stage"></div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
